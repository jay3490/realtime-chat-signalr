# Serves the Angular build and reverse-proxies the API and hub to every API replica.
#
# "api" resolves through Docker's DNS to one address per replica, and nginx balances
# across them round-robin. No stickiness is configured: the browser client opens its
# WebSocket directly (skipNegotiation), so a connection never has to come back to the
# instance that negotiated it. Cross-instance delivery is the Redis backplane's job.
upstream chat_api {
    server api:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://chat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://chat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep idle WebSockets open; SignalR sends keep-alive pings every 15 seconds.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://chat_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
