# Can run several replicas: they share the chat-notifications consumer group, and the Redis
# ledger stops two of them from sending the same notification.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-notifications
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notifications
          image: realtime-chat-notifications
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: chat-config
            - secretRef:
                name: chat-secrets
          env:
            - name: Kafka__ClientId
              value: chat-notifications
            - name: Shutdown__DrainSeconds
              value: "0"
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notifications
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-notifications
