# One replica, replaced with Recreate: the feed positions that sync cursors point at are
# assigned in the order the projection commits, which is only guaranteed with a single
# writer. To rebuild the read model, scale this to zero and run a copy with --rebuild.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projections
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-projections
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-projections
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: projections
          image: realtime-chat-projections
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: chat-config
            - secretRef:
                name: chat-secrets
          env:
            - name: Kafka__ClientId
              value: chat-projections
            - name: Shutdown__DrainSeconds
              value: "0"
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# A single writer: it may be moved during a node drain; a short pause in projection is fine.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: projections
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-projections
