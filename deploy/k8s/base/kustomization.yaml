apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The application only. PostgreSQL, Redis and Kafka are expected to exist already: the dev
# overlay adds throwaway single-node copies, the prod overlay points at managed services.
labels:
  - pairs:
      app.kubernetes.io/part-of: realtime-chat
    includeSelectors: false

resources:
  - config.yaml
  - migrate-job.yaml
  - api.yaml
  - projections.yaml
  - notifications.yaml
  - web.yaml
  - ingress.yaml
