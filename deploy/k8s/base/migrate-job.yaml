# Applies the write and read model migrations and creates the Kafka topics. Run it before
# rolling out a new version (for example as a pre-deploy step in the pipeline); the API does
# not migrate on startup, so replicas never race each other on the schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: chat-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: realtime-chat-api
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: chat-config
            - secretRef:
                name: chat-secrets
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
